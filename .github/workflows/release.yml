name: Build and Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore

      - name: Publish EndlessClient
        run: |
          dotnet publish EndlessClient/EndlessClient.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -o publish/win-x64

      - name: Publish SettingsEditor
        run: |
          dotnet publish SettingsEditor/SettingsEditor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -o publish/win-x64

      - name: Clean debug files
        run: |
          Remove-Item publish\win-x64\*.pdb -Force -ErrorAction SilentlyContinue
          Remove-Item publish\win-x64\*.config -Force -ErrorAction SilentlyContinue

      - name: Copy game assets
        run: |
          $folders = @("config", "data", "gfx", "jbox", "maps", "mfx", "pub", "sfx")
          foreach ($folder in $folders) {
            $src = "ClientAssets\$folder"
            $dst = "publish\win-x64\$folder"
            if (Test-Path $src) {
              Copy-Item -Path $src -Destination $dst -Recurse -Force
            }
          }

      - name: Copy instrument SFX from binaries package
        run: |
          $binSfx = "packages\endlessclient.binaries\1.4.0.2\build\net462\client\sfx"
          $destSfx = "publish\win-x64\sfx"
          if (Test-Path $binSfx) {
            Copy-Item "$binSfx\har*" -Destination $destSfx -Force
            Copy-Item "$binSfx\gui*" -Destination $destSfx -Force
          }

      - name: Zip
        run: Compress-Archive -Path publish\win-x64\* -DestinationPath EndlessClient-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EndlessClient-win-x64
          path: EndlessClient-win-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore

      - name: Publish EndlessClient
        run: |
          dotnet publish EndlessClient/EndlessClient.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/linux-x64

      - name: Publish SettingsEditor
        run: |
          dotnet publish SettingsEditor/SettingsEditor.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/linux-x64

      - name: Clean debug files
        run: |
          rm -f publish/linux-x64/*.pdb
          rm -f publish/linux-x64/*.config

      - name: Copy game assets
        run: |
          for folder in config data gfx jbox maps mfx pub sfx; do
            if [ -d "ClientAssets/$folder" ]; then
              cp -r "ClientAssets/$folder" "publish/linux-x64/$folder"
            fi
          done

      - name: Copy instrument SFX from binaries package
        run: |
          BIN_SFX="packages/endlessclient.binaries/1.4.0.2/build/net462/client/sfx"
          if [ -d "$BIN_SFX" ]; then
            cp "$BIN_SFX"/har* "publish/linux-x64/sfx/" 2>/dev/null || true
            cp "$BIN_SFX"/gui* "publish/linux-x64/sfx/" 2>/dev/null || true
          fi

      - name: Make executable
        run: |
          chmod +x publish/linux-x64/EndlessClient
          chmod +x publish/linux-x64/SettingsEditor

      - name: Create tarball
        run: tar -czf EndlessClient-linux-x64.tar.gz -C publish linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EndlessClient-linux-x64
          path: EndlessClient-linux-x64.tar.gz

  build-macos:
    # Cross-compile on Ubuntu to avoid MonoGame MGCB FreeImage ARM64 incompatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore

      - name: Publish EndlessClient
        run: |
          dotnet publish EndlessClient/EndlessClient.csproj \
            -c Debug \
            -r osx-arm64 \
            --self-contained true \
            -o publish/osx-arm64

      - name: Publish SettingsEditor
        run: |
          dotnet publish SettingsEditor/SettingsEditor.csproj \
            -c Debug \
            -r osx-arm64 \
            --self-contained true \
            -o publish/osx-arm64

      - name: Clean debug files
        run: |
          rm -f publish/osx-arm64/*.pdb
          rm -f publish/osx-arm64/*.config

      - name: Copy game assets
        run: |
          for folder in config data gfx jbox maps mfx pub sfx; do
            if [ -d "ClientAssets/$folder" ]; then
              cp -r "ClientAssets/$folder" "publish/osx-arm64/$folder"
            fi
          done

      - name: Copy instrument SFX from binaries package
        run: |
          BIN_SFX="packages/endlessclient.binaries/1.4.0.2/build/net462/client/sfx"
          if [ -d "$BIN_SFX" ]; then
            cp "$BIN_SFX"/har* "publish/osx-arm64/sfx/" 2>/dev/null || true
            cp "$BIN_SFX"/gui* "publish/osx-arm64/sfx/" 2>/dev/null || true
          fi

      - name: Create .app bundle
        run: |
          APP_DIR="EndlessClient.app"
          CONTENTS="$APP_DIR/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"

          mkdir -p "$MACOS" "$RESOURCES"

          # Copy published files to Resources
          cp -r publish/osx-arm64/* "$RESOURCES/"

          # Create launcher script
          cat > "$MACOS/EndlessClient" << 'LAUNCHER'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          RESOURCES="$DIR/../Resources"
          cd "$RESOURCES"
          exec "./EndlessClient" "$@"
          LAUNCHER
          chmod +x "$MACOS/EndlessClient"

          # Create Info.plist
          cat > "$CONTENTS/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>EndlessClient</string>
              <key>CFBundleDisplayName</key>
              <string>Endless Online Client</string>
              <key>CFBundleIdentifier</key>
              <string>com.endlessonline.client</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>EndlessClient</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.games</string>
          </dict>
          </plist>
          PLIST

      - name: Create SettingsEditor .app bundle
        run: |
          SE_APP="SettingsEditor.app"
          SE_CONTENTS="$SE_APP/Contents"
          SE_MACOS="$SE_CONTENTS/MacOS"

          mkdir -p "$SE_MACOS"

          # Launcher script that finds config inside sibling EndlessClient.app
          cat > "$SE_MACOS/SettingsEditor" << 'LAUNCHER'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          APP_DIR="$(dirname "$(dirname "$DIR")")"
          PARENT_DIR="$(dirname "$APP_DIR")"
          CONFIG="$PARENT_DIR/EndlessClient.app/Contents/Resources/config/settings.ini"
          RESOURCES="$PARENT_DIR/EndlessClient.app/Contents/Resources"
          exec "$RESOURCES/SettingsEditor" --config "$CONFIG" "$@"
          LAUNCHER
          chmod +x "$SE_MACOS/SettingsEditor"

          # Create Info.plist
          cat > "$SE_CONTENTS/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>SettingsEditor</string>
              <key>CFBundleDisplayName</key>
              <string>EndlessClient Settings Editor</string>
              <key>CFBundleIdentifier</key>
              <string>com.endlessonline.settingseditor</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>SettingsEditor</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.utilities</string>
          </dict>
          </plist>
          PLIST

      - name: Zip .app bundles
        run: zip -r EndlessClient-macos-arm64.zip EndlessClient.app SettingsEditor.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EndlessClient-macos-arm64
          path: EndlessClient-macos-arm64.zip

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release tag
        id: tag
        run: echo "tag=v$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: EndlessClient ${{ steps.tag.outputs.tag }}
          body: |
            Automated release from commit ${{ github.sha }}

            ### Downloads
            - **Windows (x64):** `EndlessClient-win-x64.zip` — Extract and run `EndlessClient.exe` (Settings Editor: `SettingsEditor.exe`)
            - **Linux (x64):** `EndlessClient-linux-x64.tar.gz` — Extract and run `./linux-x64/EndlessClient` (Settings Editor: `./linux-x64/SettingsEditor`)
            - **macOS (Apple Silicon):** `EndlessClient-macos-arm64.zip` — Extract and open `EndlessClient.app` (Settings Editor: `SettingsEditor.app`)
          files: |
            artifacts/EndlessClient-win-x64/EndlessClient-win-x64.zip
            artifacts/EndlessClient-linux-x64/EndlessClient-linux-x64.tar.gz
            artifacts/EndlessClient-macos-arm64/EndlessClient-macos-arm64.zip
          draft: false
          prerelease: false

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          DL_BASE="https://github.com/${REPO}/releases/download/${TAG}"

          # Build the JSON payload with Discord embed
          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "🎮 EndlessClient ${TAG}",
              "url": "${RELEASE_URL}",
              "color": 5814783,
              "description": "A new build of EndlessClient is available!",
              "fields": [
                {
                  "name": "🪟 Windows (x64)",
                  "value": "[Download .zip](${DL_BASE}/EndlessClient-win-x64.zip)\nExtract and run \`EndlessClient.exe\`",
                  "inline": true
                },
                {
                  "name": "🐧 Linux (x64)",
                  "value": "[Download .tar.gz](${DL_BASE}/EndlessClient-linux-x64.tar.gz)\nExtract and run \`./linux-x64/EndlessClient\`",
                  "inline": true
                },
                {
                  "name": "🍎 macOS (Apple Silicon)",
                  "value": "[Download .zip](${DL_BASE}/EndlessClient-macos-arm64.zip)\nExtract and open \`EndlessClient.app\`",
                  "inline": true
                }
              ],
              "footer": {
                "text": "Commit ${SHA:0:7} • View full release page for details"
              }
            }]
          }
          EOF
          )

          curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST "$DISCORD_WEBHOOK" \
            -d "$PAYLOAD"
